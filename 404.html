<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Сторінку не знайдено | Speaking Club з Ольгою Воропай</title>
  <style>
    :root {
      --color-primary: #E05324;
      --color-bg-start: #FFF9F5;
      --color-bg-end: #FCEBD9;
      --color-text-main: #1A0D07;
      --color-text-muted: #3D261C;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Open Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--color-text-main);
      background-color: var(--color-bg-start);
      background-image: linear-gradient(175deg, var(--color-bg-start) 0%, var(--color-bg-end) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #FFFFFF;
      border: 1px solid rgba(61, 38, 28, 0.8);
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(224, 83, 36, 0.12);
    }
    .code {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      color: var(--color-primary);
      margin: 0 0 8px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }
    p {
      color: var(--color-text-muted);
      margin: 0 0 28px;
    }
    a.button {
      display: inline-block;
      background: var(--color-primary);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 12px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    a.button:hover { transform: scale(1.02); opacity: 0.95; }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>Сторінку не знайдено</h1>
    <p>Можливо, посилання застаріле або сторінку переміщено. Поверніться на головну сторінку клубу.</p>
    <a class="button" href="https://konkor1.github.io/speaking-club/">На головну</a>
  </main>
</body>
</html>
